<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Lineare Regression Visualisierung</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f0f0f0;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .controls {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f8f8f8;
            border-radius: 5px;
        }
        .stats {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8f4e8;
            border-radius: 5px;
        }
        canvas {
            border: 1px solid #ddd;
            background-color: white;
        }
        .slider-container {
            margin: 10px 0;
        }
        label {
            display: inline-block;
            width: 120px;
        }
        button {
            margin: 10px 5px;
            padding: 8px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .stat-value {
            font-weight: bold;
            color: #2c662d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Lineare Regression Visualisierung</h1>
        
        <div class="controls">
            <div class="slider-container">
                <label for="slope">Steigung (m):</label>
                <input type="range" id="slope" min="-2" max="2" step="0.1" value="1">
                <span id="slopeValue">1.0</span>
            </div>
            
            <div class="slider-container">
                <label for="intercept">y-Achsenabschnitt (b):</label>
                <input type="range" id="intercept" min="-3" max="3" step="0.1" value="0">
                <span id="interceptValue">0.0</span>
            </div>
            
            <button onclick="addDataPoint()">Datenpunkt hinzufügen</button>
            <button onclick="addMultiplePoints()">10 Punkte hinzufügen</button>
            <button onclick="clearPoints()">Punkte löschen</button>
            <button onclick="calculateOptimalRegression()">Optimale Regression</button>
        </div>
        
        <canvas id="regressionCanvas" width="800" height="500"></canvas>

        <div class="stats">
            <h3>Statistische Kennzahlen:</h3>
            <p>R² (Bestimmtheitsmaß): <span id="r2" class="stat-value">-</span></p>
            <p>MSE (Mittlerer quadratischer Fehler): <span id="mse" class="stat-value">-</span></p>
            <p>Optimale Parameter:</p>
            <p>- Steigung (m): <span id="optimalSlope" class="stat-value">-</span></p>
            <p>- y-Achsenabschnitt (b): <span id="optimalIntercept" class="stat-value">-</span></p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('regressionCanvas');
        const ctx = canvas.getContext('2d');
        let dataPoints = [];
        let showErrorSquares = true;
        
        // Koordinatensystem-Parameter
        const margin = 50;
        const scale = 50; // Pixel pro Einheit
        
        // Koordinatenbereich
        const xMin = -6, xMax = 6;
        const yMin = -4, yMax = 4;
        
        // Ursprung in Canvas-Koordinaten (x=0, y=0 soll in der Mitte sein)
        const originX = margin + (-xMin) * scale;
        const originY = canvas.height - margin - (-yMin) * scale;

        function toCanvasX(x) {
            return margin + (x - xMin) * scale;
        }
        
        function toCanvasY(y) {
            return canvas.height - margin - (y - yMin) * scale;
        }

        function calculateOptimalRegression() {
            if (dataPoints.length < 2) {
                alert('Mindestens 2 Datenpunkte erforderlich!');
                return;
            }

            const meanX = dataPoints.reduce((sum, p) => sum + p.x, 0) / dataPoints.length;
            const meanY = dataPoints.reduce((sum, p) => sum + p.y, 0) / dataPoints.length;

            let numerator = 0;
            let denominator = 0;
            dataPoints.forEach(point => {
                numerator += (point.x - meanX) * (point.y - meanY);
                denominator += Math.pow(point.x - meanX, 2);
            });

            const optimalSlope = numerator / denominator;
            const optimalIntercept = meanY - optimalSlope * meanX;

            // Slider-Grenzen beachten
            const clampedSlope = Math.max(-2, Math.min(2, optimalSlope));
            const clampedIntercept = Math.max(-3, Math.min(3, optimalIntercept));
            
            document.getElementById('slope').value = clampedSlope;
            document.getElementById('intercept').value = clampedIntercept;

            updateStatistics(optimalSlope, optimalIntercept);
            updateDisplay();
        }

        function updateStatistics(slope, intercept) {
            if (dataPoints.length < 2) {
                document.getElementById('r2').textContent = '-';
                document.getElementById('mse').textContent = '-';
                document.getElementById('optimalSlope').textContent = '-';
                document.getElementById('optimalIntercept').textContent = '-';
                return;
            }

            let mse = 0;
            dataPoints.forEach(point => {
                const predicted = slope * point.x + intercept;
                mse += Math.pow(point.y - predicted, 2);
            });
            mse /= dataPoints.length;

            const meanY = dataPoints.reduce((sum, p) => sum + p.y, 0) / dataPoints.length;
            let totalSS = 0;
            let residualSS = 0;
            dataPoints.forEach(point => {
                totalSS += Math.pow(point.y - meanY, 2);
                const predicted = slope * point.x + intercept;
                residualSS += Math.pow(point.y - predicted, 2);
            });
            const r2 = totalSS > 0 ? 1 - (residualSS / totalSS) : 0;

            document.getElementById('r2').textContent = r2.toFixed(4);
            document.getElementById('mse').textContent = mse.toFixed(4);
            document.getElementById('optimalSlope').textContent = slope.toFixed(4);
            document.getElementById('optimalIntercept').textContent = intercept.toFixed(4);
        }
        
        function drawGrid() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Hilfslinien (grau)
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 1;
            
            // Vertikale Hilfslinien
            for (let x = xMin; x <= xMax; x++) {
                ctx.beginPath();
                ctx.moveTo(toCanvasX(x), margin);
                ctx.lineTo(toCanvasX(x), canvas.height - margin);
                ctx.stroke();
            }
            
            // Horizontale Hilfslinien
            for (let y = yMin; y <= yMax; y++) {
                ctx.beginPath();
                ctx.moveTo(margin, toCanvasY(y));
                ctx.lineTo(canvas.width - margin, toCanvasY(y));
                ctx.stroke();
            }
            
            // Hauptachsen bei x=0 und y=0 (schwarz, dicker)
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            
            // y-Achse (bei x=0)
            ctx.beginPath();
            ctx.moveTo(toCanvasX(0), margin);
            ctx.lineTo(toCanvasX(0), canvas.height - margin);
            ctx.stroke();
            
            // x-Achse (bei y=0)
            ctx.beginPath();
            ctx.moveTo(margin, toCanvasY(0));
            ctx.lineTo(canvas.width - margin, toCanvasY(0));
            ctx.stroke();
            
            // Achsenbeschriftungen
            ctx.fillStyle = '#000';
            ctx.font = '12px Arial';
            
            // x-Achsen Markierungen
            ctx.textAlign = 'center';
            for (let x = xMin; x <= xMax; x++) {
                if (x !== 0) {
                    ctx.fillText(x, toCanvasX(x), toCanvasY(0) + 18);
                }
            }
            
            // y-Achsen Markierungen
            ctx.textAlign = 'right';
            for (let y = yMin; y <= yMax; y++) {
                if (y !== 0) {
                    ctx.fillText(y, toCanvasX(0) - 8, toCanvasY(y) + 4);
                }
            }
            
            // Ursprung beschriften
            ctx.textAlign = 'right';
            ctx.fillText('0', toCanvasX(0) - 8, toCanvasY(0) + 18);
            
            // Achsenbeschriftung
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('x', canvas.width - margin + 20, toCanvasY(0) + 5);
            ctx.fillText('y', toCanvasX(0), margin - 10);
        }

        function drawErrorLines() {
            const slope = parseFloat(document.getElementById('slope').value);
            const intercept = parseFloat(document.getElementById('intercept').value);

            ctx.strokeStyle = 'rgba(255, 100, 100, 0.7)';
            ctx.lineWidth = 2;

            dataPoints.forEach(point => {
                const predictedY = slope * point.x + intercept;
                
                ctx.beginPath();
                ctx.moveTo(toCanvasX(point.x), toCanvasY(point.y));
                ctx.lineTo(toCanvasX(point.x), toCanvasY(predictedY));
                ctx.stroke();
            });
        }
        
        function drawRegressionLine() {
            const slope = parseFloat(document.getElementById('slope').value);
            const intercept = parseFloat(document.getElementById('intercept').value);
            
            ctx.beginPath();
            ctx.strokeStyle = '#ff0000';
            ctx.lineWidth = 2;
            
            // Linie über den gesamten sichtbaren Bereich
            const x1 = xMin;
            const y1 = slope * x1 + intercept;
            const x2 = xMax;
            const y2 = slope * x2 + intercept;
            
            ctx.moveTo(toCanvasX(x1), toCanvasY(y1));
            ctx.lineTo(toCanvasX(x2), toCanvasY(y2));
            ctx.stroke();
            
            // y-Achsenabschnitt markieren (wo die Linie x=0 schneidet)
            ctx.fillStyle = '#ff0000';
            ctx.beginPath();
            ctx.arc(toCanvasX(0), toCanvasY(intercept), 6, 0, Math.PI * 2);
            ctx.fill();
            
            // Beschriftung des y-Achsenabschnitts
            ctx.fillStyle = '#cc0000';
            ctx.font = 'bold 12px Arial';
            ctx.textAlign = 'left';
            ctx.fillText(`b = ${intercept.toFixed(1)}`, toCanvasX(0) + 10, toCanvasY(intercept) - 8);

            updateStatistics(slope, intercept);
        }
        
        function drawPoints() {
            ctx.fillStyle = '#0066cc';
            dataPoints.forEach(point => {
                ctx.beginPath();
                ctx.arc(toCanvasX(point.x), toCanvasY(point.y), 6, 0, Math.PI * 2);
                ctx.fill();
            });
        }
        
        function updateDisplay() {
            drawGrid();
            if (showErrorSquares) {
                drawErrorLines();
            }
            drawRegressionLine();
            drawPoints();
            
            document.getElementById('slopeValue').textContent = 
                parseFloat(document.getElementById('slope').value).toFixed(1);
            document.getElementById('interceptValue').textContent = 
                parseFloat(document.getElementById('intercept').value).toFixed(1);
        }
        
        function addDataPoint() {
            const slope = parseFloat(document.getElementById('slope').value);
            const intercept = parseFloat(document.getElementById('intercept').value);
            
            // Zufälliger x-Wert im sichtbaren Bereich
            const x = Math.random() * (xMax - xMin - 2) + xMin + 1;
            // y-Wert auf der Geraden plus zufällige Abweichung
            const y = slope * x + intercept + (Math.random() - 0.5) * 2;
            
            // Nur hinzufügen wenn im sichtbaren Bereich
            if (y >= yMin && y <= yMax) {
                dataPoints.push({x, y});
            } else {
                // Nochmal versuchen mit kleinerem y
                const yClipped = Math.max(yMin + 0.5, Math.min(yMax - 0.5, y));
                dataPoints.push({x, y: yClipped});
            }
            updateDisplay();
        }

        function addMultiplePoints() {
            for(let i = 0; i < 10; i++) {
                addDataPoint();
            }
        }
        
        function clearPoints() {
            dataPoints = [];
            updateDisplay();
            updateStatistics(0, 0);
        }
        
        // Event Listener für Slider
        document.getElementById('slope').addEventListener('input', updateDisplay);
        document.getElementById('intercept').addEventListener('input', updateDisplay);
        
        // Initiale Anzeige
        updateDisplay();
    </script>
</body>
</html>
