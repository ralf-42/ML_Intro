<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Bildfaltung mit p5.js</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    
    <style>
        body {
            font-family: sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .controls-container {
            background: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        .upload-row {
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            gap: 15px;
            align-items: center;
        }

        #filterDescription {
            color: #666;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        /* Das Kern-Layout: Schiebt die Canvases nebeneinander */
        .canvas-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            width: 100%;
        }

        .canvas-box {
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }

        .canvas-box h3 {
            margin-top: 0;
            margin-bottom: 10px;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="controls-container">
        <div class="upload-row">
            <input type="file" id="imageUpload" accept="image/*">
            <select id="filterSelect">
                <option value="horizontalEdge">Horizontale Kanten</option>
                <option value="verticalEdge">Vertikale Kanten</option>
                <option value="edgeDetection">Kantenerkennung</option>
                <option value="sharpen" selected>Schärfen</option>
                <option value="gaussianBlur">Weichzeichnen</option>
                <option value="emboss">Relief</option>
                <option value="sobelX">Sobel X</option>
            </select>
        </div>
        <h2 id="filterName" style="margin: 10px 0 5px 0;">Schärfen</h2>
        <p id="filterDescription">Verstärkt Kontraste und Details im Bild.</p>
    </div>

    <div class="canvas-container">
        <div class="canvas-box">
            <h3>Originalbild</h3>
            <div id="originalCanvas"></div>
        </div>
        <div class="canvas-box">
            <h3>Gefiltertes Bild</h3>
            <div id="filteredCanvas"></div>
        </div>
    </div>

    <script src="sketch.js"></script>
</body>
</html>
