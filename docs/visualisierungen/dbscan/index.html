<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DBSCAN Clustering</title>
  <style>
    /* Kein p5.js – reines Canvas2D */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f1419; color: #e8edf4; font-family: system-ui, sans-serif; overflow: hidden; }
  </style>
</head>
<body>
<canvas id="myCanvas"></canvas>
<script>
// ── Konstanten ────────────────────────────────────────────────────────────────
const COLORS = {
  bg:      '#0f1419', bg2: '#1a2027', card: '#242d38',
  txt:     '#e8edf4', txt2: '#8899a6',
  orange:  '#fb923c', pink: '#f472b6', green: '#34d399',
  blue:    '#4f9cf9', cyan: '#22d3ee', noise: '#6b7280',
  border:  '#2f3b47'
};
const CLUSTER_COLS = [
  '#4f9cf9','#f472b6','#34d399','#fb923c',
  '#a78bfa','#22d3ee','#fbbf24','#f87171','#818cf8','#2dd4bf'
];
const UNV=0, NOISE=-1, CORE=1, BORDER=2;

// ── Canvas ────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('myCanvas');
const ctx    = canvas.getContext('2d');
let W, H, DPR;

function resize() {
  DPR = window.devicePixelRatio || 1;
  W   = window.innerWidth;
  H   = window.innerHeight;
  canvas.width  = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.scale(DPR, DPR);
  buildLayout();
  redraw();
}

// ── Layout ────────────────────────────────────────────────────────────────────
let SIDE_W, SIDE_X, DATA_X, DATA_Y, DATA_W, DATA_H;
let btns = [], sliders = [];

function buildLayout() {
  SIDE_W = Math.min(300, W * 0.27);
  SIDE_X = W - SIDE_W - 16;
  DATA_X = 16;
  DATA_Y = 88;
  DATA_W = SIDE_X - 32;
  DATA_H = H - DATA_Y - 16;

  const bx = SIDE_X, bh = 36, bw2 = (SIDE_W - 8) / 2;
  let by = 88;
  btns = [
    { x:bx,        y:by,      w:bw2,   h:bh, lbl:'🎲 Zufällig', id:'random' },
    { x:bx+bw2+8,  y:by,      w:bw2,   h:bh, lbl:'🗑 Löschen',  id:'clear'  },
    { x:bx,        y:by+bh+6, w:SIDE_W,h:bh, lbl:'⏭ Nächster Schritt', id:'step' },
    { x:bx,        y:by+bh*2+12,w:SIDE_W,h:bh,lbl:'▶ Automatisch abspielen',id:'run' },
  ];

  let sy = by + bh * 3 + 28;
  sliders = [
    { x:bx, y:sy,    w:SIDE_W, val:epsilon, min:20, max:120, lbl:'ε  Epsilon (Radius)', id:'eps' },
    { x:bx, y:sy+58, w:SIDE_W, val:minPts,  min:2,  max:10,  lbl:'MinPts  Min. Nachbarn', id:'min' },
  ];
}

// ── Zustand ───────────────────────────────────────────────────────────────────
let pts=[], pType=[], cId=[], vis=[];
let epsilon=50, minPts=4, clusterId=0;
let curPt=-1, curNeigh=[], queue=[];
let algoStep=0, finished=false, running=false, hovered=-1;
let exTitle='Bereit', exText='DBSCAN findet Cluster über Dichte. Punkte setzen oder "Zufällig" klicken.';
let dragSl=null, dragStartX=0, dragStartVal=0;

// ── Algo-Hilfen ───────────────────────────────────────────────────────────────
function dst(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

// Gibt alle Indizes zurück, die innerhalb von epsilon liegen (Punkt selbst ausgeschlossen)
function getNeighbors(i){
  var nb=[];
  for(var j=0;j<pts.length;j++){
    if(j!==i && dst(pts[i],pts[j])<=epsilon) nb.push(j);
  }
  return nb;
}

function setEx(t,x){ exTitle=t; exText=x; }

// ── 2-Phasen-DBSCAN ──────────────────────────────────────────────────────────
//
// Phase 1: Alle Punkte durchlaufen → Kernpunkte identifizieren
//          nbCache[i] speichert die Nachbarn jedes Punktes
//          corePts = Liste aller Kernpunkt-Indizes
//
// Phase 2: Für jeden unbesuchten Kernpunkt → BFS → Cluster aufbauen
//          Randpunkte = Nicht-Kernpunkte im Radius eines Kernpunkts
//          Rauschen   = weder Kern- noch Randpunkt

var nbCache = [];    // nbCache[i] = Nachbar-Array von Punkt i (aus Phase 1)
var corePts = [];    // Indizes aller Kernpunkte

// Animation-Zustand
var _iv       = null;
var _phase    = 0;   // 0=idle 1=Phase1(Core-Erkennung) 2=Phase2(Cluster-Bildung)
var _p1idx    = 0;   // aktueller Index in Phase 1
var _coreIdx  = 0;   // aktueller Index in corePts (Phase 2)
var _bfsQueue = [];  // BFS-Queue für aktiven Cluster (Phase 2)
var _visited  = [];  // besucht in Phase 2 (Index → bool)

function resetAlgo(keepRunning){
  if(_iv){ clearInterval(_iv); _iv=null; }
  pType=pts.map(function(){ return UNV; });
  cId=pts.map(function(){ return -1; });
  vis=pts.map(function(){ return false; });
  nbCache=[]; corePts=[];
  clusterId=0; curPt=-1; curNeigh=[]; queue=[];
  _phase=0; _p1idx=0; _coreIdx=0; _bfsQueue=[]; _visited=[];
  algoStep=0; finished=false;
  if(!keepRunning) running=false;
  setEx('Zurückgesetzt','Algorithmus zurückgesetzt.');
}

// ── Step-Modus (manuell) ─────────────────────────────────────────────────────
// ── Kernlogik (ein Schritt) ───────────────────────────────────────────────────
function _doStep(){
  if(finished) return;

  // ── Phase 1: Kernpunkte identifizieren ──────────────────────────────────────
  if(_phase === 0 || _phase === 1){
    if(_phase === 0){ _phase=1; _p1idx=0; nbCache=[]; corePts=[]; }

    if(_p1idx < pts.length){
      var nb = getNeighbors(_p1idx);
      nbCache[_p1idx] = nb;
      curPt    = _p1idx;
      curNeigh = nb;
      if(nb.length >= minPts - 1){
        pType[_p1idx] = CORE;
        corePts.push(_p1idx);
        setEx('Phase 1: Kernpunkt',
          'Punkt '+(_p1idx+1)+': '+(nb.length+1)+' Punkte im Radius >= MinPts('+minPts+') \u2192 Kernpunkt.');
      } else {
        pType[_p1idx] = NOISE;
        setEx('Phase 1: Kein Kernpunkt',
          'Punkt '+(_p1idx+1)+': '+(nb.length+1)+' Punkte im Radius < MinPts('+minPts+') \u2192 vorl. Rauschen.');
      }
      _p1idx++;
      algoStep = 1;
      redraw(); return;
    }

    // Phase 1 fertig
    _phase=2; _coreIdx=0; _visited=pts.map(function(){return false;});
    curNeigh=[]; curPt=-1; algoStep=2;
    setEx('Phase 1 abgeschlossen', corePts.length+' Kernpunkte gefunden. Starte Cluster-Bildung.');
    redraw(); return;
  }

  // ── Phase 2: Cluster per BFS bilden ─────────────────────────────────────────
  if(_phase === 2){

    // BFS-Queue abarbeiten
    if(_bfsQueue.length > 0){
      var idx = _bfsQueue.shift();
      if(!_visited[idx]){
        _visited[idx] = true;
        cId[idx]      = clusterId;
        curPt         = idx;
        curNeigh      = nbCache[idx] || [];
        if(pType[idx] === CORE){
          curNeigh.forEach(function(n){ if(!_visited[n]) _bfsQueue.push(n); });
          setEx('Phase 2: Cluster erweitern',
            'Kernpunkt '+(idx+1)+' \u2192 '+curNeigh.length+' Nachbarn geprueft. Cluster '+(clusterId+1)+', Queue: '+_bfsQueue.length+'.');
        } else {
          pType[idx] = BORDER;
          setEx('Phase 2: Randpunkt',
            'Punkt '+(idx+1)+' ist Randpunkt von Cluster '+(clusterId+1)+'.');
        }
      }
      algoStep=4; redraw(); return;
    }

    // BFS leer → Cluster abschließen, nächsten Kernpunkt suchen
    if(_coreIdx > 0) clusterId++;   // erstes Mal: _coreIdx=0 → kein Increment

    while(_coreIdx < corePts.length && _visited[corePts[_coreIdx]]) _coreIdx++;

    if(_coreIdx >= corePts.length){
      // Fertig
      for(var k=0;k<pts.length;k++) if(cId[k]===-1) pType[k]=NOISE;
      algoStep=0; finished=true; running=false;
      curPt=-1; curNeigh=[];
      setEx('Fertig \u2713',
        clusterId+' Cluster gefunden, '+pType.filter(function(t){return t===NOISE;}).length+' Rauschen.');
      redraw(); return;
    }

    // Neuen Cluster starten
    var sc = corePts[_coreIdx];
    _coreIdx++;
    _visited[sc] = true;
    cId[sc]      = clusterId;
    curPt        = sc;
    curNeigh     = nbCache[sc] || [];
    curNeigh.forEach(function(n){ if(!_visited[n]) _bfsQueue.push(n); });
    algoStep=3;
    setEx('Phase 2: Neuer Cluster',
      'Cluster '+(clusterId+1)+' startet bei Kernpunkt '+(sc+1)+'. '+_bfsQueue.length+' Punkte in Queue.');
    redraw();
  }
}

// ── Schritt-Modus (Button) ────────────────────────────────────────────────────
function stepAlgo(){
  if(running || pts.length===0) return;
  _doStep();
}

// ── Auto-Modus ────────────────────────────────────────────────────────────────
function runFull(){
  if(running || pts.length===0) return;
  running=true;
  resetAlgo(true);
  redraw();

  _iv = setInterval(function(){
    if(finished){ clearInterval(_iv); _iv=null; return; }
    _doStep();
  }, 220);
}

// ── Zufallsdaten ──────────────────────────────────────────────────────────────
function generateRandom(){
  if(running)return;
  pts=[]; pType=[]; cId=[]; vis=[];
  const pad=60, numC=2+Math.floor(Math.random()*3);
  for(let c=0;c<numC;c++){
    const ox=DATA_X+pad+Math.random()*(DATA_W-2*pad);
    const oy=DATA_Y+pad+Math.random()*(DATA_H-2*pad);
    const n=10+Math.floor(Math.random()*15), sp=25+Math.random()*45;
    const elong=Math.random()>.5;
    for(let i=0;i<n;i++){
      let px,py;
      if(elong){ px=ox+(Math.random()-.5)*sp*2; py=oy+(Math.random()-.5)*sp*.6; }
      else{ const a=Math.random()*Math.PI*2,r=Math.random()*sp; px=ox+Math.cos(a)*r; py=oy+Math.sin(a)*r; }
      if(px>DATA_X+pad&&px<DATA_X+DATA_W-pad&&py>DATA_Y+pad&&py<DATA_Y+DATA_H-pad){
        pts.push({x:px,y:py}); pType.push(UNV); cId.push(-1); vis.push(false);
      }
    }
  }
  for(let i=0;i<5+Math.floor(Math.random()*7);i++){
    pts.push({x:DATA_X+pad+Math.random()*(DATA_W-2*pad),y:DATA_Y+pad+Math.random()*(DATA_H-2*pad)});
    pType.push(UNV); cId.push(-1); vis.push(false);
  }
  resetAlgo(); setEx('Daten generiert',`${pts.length} Punkte erzeugt.`); redraw();
}

function clearAll(){
  if(running)return;
  pts=[]; pType=[]; cId=[]; vis=[]; resetAlgo();
  setEx('Geleert','Klicke ins Feld, um Punkte zu setzen.'); redraw();
}

// ── Zeichnen ──────────────────────────────────────────────────────────────────
function redraw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=COLORS.bg; ctx.fillRect(0,0,W,H);
  drawHeader(); drawDataArea(); drawSidebar();
}

function drawHeader(){
  ctx.fillStyle=COLORS.txt; ctx.font='bold 20px system-ui'; ctx.textAlign='left';
  ctx.fillText('DBSCAN Clustering',16,28);
  ctx.fillStyle=COLORS.txt2; ctx.font='12px system-ui';
  ctx.fillText('Density-Based Spatial Clustering of Applications with Noise',16,48);

  // Badges
  const badges=[
    {col:COLORS.green, lbl:pType.filter(t=>t===CORE).length+' Kern'},
    {col:COLORS.blue,  lbl:pType.filter(t=>t===BORDER).length+' Rand'},
    {col:COLORS.noise, lbl:pType.filter(t=>t===NOISE).length+' Rauschen'},
    {col:COLORS.txt2,  lbl:pts.length+' Punkte'},
  ];
  let bx=16;
  for(const b of badges){
    ctx.font='11px system-ui';
    const tw=ctx.measureText(b.lbl).width+24;
    ctx.fillStyle=COLORS.bg2; ctx.strokeStyle=COLORS.border; ctx.lineWidth=1;
    roundRect(ctx,bx,60,tw,20,10); ctx.fill(); ctx.stroke();
    ctx.fillStyle=b.col; ctx.beginPath(); ctx.arc(bx+9,70,4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=COLORS.txt; ctx.textAlign='left'; ctx.fillText(b.lbl,bx+18,74);
    bx+=tw+6;
  }
}

function roundRect(c,x,y,w,h,r){
  c.beginPath(); c.moveTo(x+r,y);
  c.lineTo(x+w-r,y); c.arcTo(x+w,y,x+w,y+r,r);
  c.lineTo(x+w,y+h-r); c.arcTo(x+w,y+h,x+w-r,y+h,r);
  c.lineTo(x+r,y+h); c.arcTo(x,y+h,x,y+h-r,r);
  c.lineTo(x,y+r); c.arcTo(x,y,x+r,y,r); c.closePath();
}

function drawDataArea(){
  // Hintergrund
  ctx.fillStyle=COLORS.card; ctx.strokeStyle=COLORS.border; ctx.lineWidth=1;
  roundRect(ctx,DATA_X,DATA_Y,DATA_W,DATA_H,12); ctx.fill(); ctx.stroke();

  // ε-Kreis aktueller Punkt
  if(curPt>=0&&algoStep>=2){
    ctx.strokeStyle='rgba(34,211,238,0.35)'; ctx.lineWidth=2;
    ctx.setLineDash([5,5]);
    ctx.beginPath(); ctx.arc(pts[curPt].x,pts[curPt].y,epsilon,0,Math.PI*2);
    ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='rgba(34,211,238,0.06)'; ctx.fill();
  }

  // ε-Kreis Hover
  if(hovered>=0&&hovered!==curPt){
    ctx.strokeStyle='rgba(251,191,36,0.4)'; ctx.lineWidth=1;
    ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.arc(pts[hovered].x,pts[hovered].y,epsilon,0,Math.PI*2);
    ctx.stroke(); ctx.setLineDash([]);
  }

  // Verbindungslinien
  if(curNeigh.length>0&&curPt>=0){
    ctx.strokeStyle='rgba(34,211,238,0.35)'; ctx.lineWidth=1;
    for(const ni of curNeigh){
      ctx.beginPath(); ctx.moveTo(pts[curPt].x,pts[curPt].y);
      ctx.lineTo(pts[ni].x,pts[ni].y); ctx.stroke();
    }
  }

  // Queue
  if(queue.length>0){
    ctx.strokeStyle='rgba(251,191,36,0.5)'; ctx.lineWidth=2; ctx.setLineDash([2,2]);
    for(const qi of queue){ ctx.beginPath(); ctx.arc(pts[qi].x,pts[qi].y,13,0,Math.PI*2); ctx.stroke(); }
    ctx.setLineDash([]);
  }

  // Punkte
  for(let i=0;i<pts.length;i++){
    const p=pts[i], tp=pType[i], cl=cId[i];
    let col,sz;
    if(tp===NOISE){ col=COLORS.noise; sz=5; }
    else if(tp===CORE){ col=cl>=0?CLUSTER_COLS[cl%CLUSTER_COLS.length]:COLORS.txt2; sz=9; }
    else if(tp===BORDER){ col=cl>=0?CLUSTER_COLS[cl%CLUSTER_COLS.length]:COLORS.txt2; sz=6; }
    else { col=COLORS.txt2; sz=6; }

    if(i===curPt&&algoStep>0){
      ctx.strokeStyle='#22d3ee'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(p.x,p.y,sz+7,0,Math.PI*2); ctx.stroke();
    }
    if(curNeigh.includes(i)){
      ctx.strokeStyle='rgba(34,211,238,0.7)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(p.x,p.y,sz+4,0,Math.PI*2); ctx.stroke();
    }
    if(tp===CORE){ ctx.shadowColor=col; ctx.shadowBlur=12; }
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(p.x,p.y,sz,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    if(tp===CORE){
      ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(p.x,p.y,sz+3,0,Math.PI*2); ctx.stroke();
    }
  }

  if(pts.length===0){
    ctx.fillStyle=COLORS.txt2; ctx.font='13px system-ui'; ctx.textAlign='center';
    ctx.fillText('Klicke hier für Punkte  oder  🎲 Zufällig',DATA_X+DATA_W/2,DATA_Y+DATA_H/2);
  }
  ctx.fillStyle=COLORS.txt2; ctx.font='11px system-ui'; ctx.textAlign='left';
  ctx.fillText('💡 Klick = Punkt setzen',DATA_X+8,DATA_Y+DATA_H-8);
}

function drawSidebar(){
  const sx=SIDE_X, sw=SIDE_W;

  // ── Buttons ──
  for(const b of btns){
    const dis=running&&b.id!==''; // alle während running deaktiviert
    const isStep=b.id==='step', isRun=b.id==='run';
    ctx.fillStyle= dis?'#1e2832': isStep?COLORS.green: isRun?COLORS.orange: COLORS.card;
    ctx.strokeStyle=COLORS.border; ctx.lineWidth=1;
    roundRect(ctx,b.x,b.y,b.w,b.h,8); ctx.fill(); if(!isStep&&!isRun)ctx.stroke();
    ctx.fillStyle= dis?COLORS.txt2: (isStep||isRun)?COLORS.bg: COLORS.txt;
    ctx.font='bold 13px system-ui'; ctx.textAlign='center';
    ctx.fillText(b.lbl,b.x+b.w/2,b.y+b.h/2+5);
  }

  // ── Sliders ──
  for(const sl of sliders){
    ctx.fillStyle=COLORS.txt2; ctx.font='11px system-ui'; ctx.textAlign='left';
    ctx.fillText(sl.lbl,sl.x,sl.y+4);
    // Wert
    ctx.fillStyle=COLORS.orange; roundRect(ctx,sl.x+sl.w-34,sl.y-6,34,18,5); ctx.fill();
    ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.font='bold 11px system-ui';
    ctx.fillText(sl.val,sl.x+sl.w-17,sl.y+6);
    // Track
    const ty=sl.y+22;
    ctx.fillStyle='#1a2027'; roundRect(ctx,sl.x,ty-4,sl.w,8,4); ctx.fill();
    const frac=(sl.val-sl.min)/(sl.max-sl.min);
    ctx.fillStyle=COLORS.orange; roundRect(ctx,sl.x,ty-4,sl.w*frac,8,4); ctx.fill();
    // Thumb
    ctx.fillStyle=COLORS.orange; ctx.beginPath(); ctx.arc(sl.x+sl.w*frac,ty,9,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(sl.x+sl.w*frac,ty,4,0,Math.PI*2); ctx.fill();
  }

  // ── Algo-Schritte ──
  const stepDefs=[
    {t:'Punkt auswählen',  d:'Unbesuchten Punkt wählen'},
    {t:'Nachbarn finden',  d:'Alle im ε-Radius zählen'},
    {t:'Klassifizieren',   d:'Kern wenn ≥ MinPts Nachbarn'},
    {t:'Cluster erweitern',d:'Dichte-erreichbare Punkte'},
  ];
  let stepY=sliders[1].y+50;
  for(let i=0;i<4;i++){
    const s=stepDefs[i], sy2=stepY+i*50, active=algoStep===i+1;
    ctx.fillStyle=active?'rgba(52,211,153,0.12)':COLORS.card;
    ctx.strokeStyle=active?COLORS.green:COLORS.border; ctx.lineWidth=active?2:1;
    roundRect(ctx,sx,sy2,sw,42,8); ctx.fill(); ctx.stroke();
    ctx.fillStyle=active?COLORS.green:COLORS.border;
    ctx.beginPath(); ctx.arc(sx+16,sy2+21,10,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=active?COLORS.bg:COLORS.txt2; ctx.font='bold 10px system-ui'; ctx.textAlign='center';
    ctx.fillText(i+1,sx+16,sy2+25);
    ctx.fillStyle=active?COLORS.txt:COLORS.txt2; ctx.font=(active?'bold ':'')+'12px system-ui'; ctx.textAlign='left';
    ctx.fillText(s.t,sx+32,sy2+16);
    ctx.fillStyle=COLORS.txt2; ctx.font='10px system-ui';
    ctx.fillText(s.d,sx+32,sy2+31);
  }

  // ── Erklärungsbox ──
  const exY=stepY+4*50+10;
  ctx.fillStyle='#1a2027'; ctx.strokeStyle=COLORS.cyan; ctx.lineWidth=1;
  roundRect(ctx,sx,exY,sw,82,8); ctx.fill(); ctx.stroke();
  ctx.fillStyle=COLORS.cyan; ctx.fillRect(sx,exY,4,82);
  ctx.fillStyle=COLORS.cyan; ctx.font='bold 11px system-ui'; ctx.textAlign='left';
  ctx.fillText(exTitle,sx+10,exY+16);
  ctx.fillStyle=COLORS.txt2; ctx.font='10px system-ui';
  wrapText(ctx,exText,sx+10,exY+32,sw-20,14,3);

  // ── Stats ──
  const statY=exY+90, sw3=(sw-16)/3;
  const stats=[
    {v:pts.length,      l:'Punkte'},
    {v:clusterId,       l:'Cluster'},
    {v:curPt>=0?curPt+1:'-', l:'Aktuell'},
  ];
  for(let i=0;i<3;i++){
    const sx2=sx+i*(sw3+8);
    ctx.fillStyle=COLORS.card; roundRect(ctx,sx2,statY,sw3,40,6); ctx.fill();
    ctx.fillStyle=COLORS.cyan; ctx.font='bold 16px system-ui'; ctx.textAlign='center';
    ctx.fillText(stats[i].v,sx2+sw3/2,statY+22);
    ctx.fillStyle=COLORS.txt2; ctx.font='9px system-ui';
    ctx.fillText(stats[i].l,sx2+sw3/2,statY+35);
  }
}

function wrapText(c,text,x,y,maxW,lineH,maxLines){
  const words=text.split(' '); let line='', lines=[];
  for(const w of words){
    const test=line+w+' ';
    if(c.measureText(test).width>maxW&&line!==''){lines.push(line.trim());line=w+' ';}
    else line=test;
  }
  lines.push(line.trim());
  lines.slice(0,maxLines).forEach((l,i)=>c.fillText(l,x,y+i*lineH));
}

// ── Events ────────────────────────────────────────────────────────────────────
canvas.addEventListener('mousedown',e=>{
  const mx=e.offsetX, my=e.offsetY;

  // Slider
  for(const sl of sliders){
    const ty=sl.y+22;
    if(mx>=sl.x&&mx<=sl.x+sl.w&&Math.abs(my-ty)<12){
      dragSl=sl; dragStartX=mx; dragStartVal=sl.val; return;
    }
  }

  // Buttons
  for(const b of btns){
    if(mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h){
      if(running) return;
      if(b.id==='random') generateRandom();
      if(b.id==='clear')  clearAll();
      if(b.id==='step')   stepAlgo();
      if(b.id==='run')    runFull();
      return;
    }
  }

  // Punkt setzen
  if(mx>DATA_X&&mx<DATA_X+DATA_W&&my>DATA_Y&&my<DATA_Y+DATA_H){
    pts.push({x:mx,y:my}); pType.push(UNV); cId.push(-1); vis.push(false);
    if(algoStep>0) resetAlgo();
    redraw();
  }
});

canvas.addEventListener('mousemove',e=>{
  const mx=e.offsetX, my=e.offsetY;

  if(dragSl){
    const frac=Math.max(0,Math.min(1,(mx-dragSl.x)/dragSl.w));
    dragSl.val=Math.round(dragSl.min+frac*(dragSl.max-dragSl.min));
    if(dragSl.id==='eps') epsilon=dragSl.val;
    if(dragSl.id==='min') minPts=dragSl.val;
    if(algoStep>0) resetAlgo();
    redraw(); return;
  }

  hovered=-1;
  for(let i=0;i<pts.length;i++){
    if(Math.hypot(mx-pts[i].x,my-pts[i].y)<14){ hovered=i; break; }
  }
  redraw();
});

canvas.addEventListener('mouseup',()=>{ dragSl=null; });
canvas.addEventListener('mouseleave',()=>{ hovered=-1; dragSl=null; redraw(); });
window.addEventListener('resize',resize);

// ── Start ─────────────────────────────────────────────────────────────────────
resize();
</script>
